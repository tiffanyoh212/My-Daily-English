.shell:has(#chat:not([hidden])){height:100dvh;min-height:0;padding-bottom:env(safe-area-inset-bottom);overflow:hidden}.chat-view{height:100%;min-height:0}.chat-view .top{flex:none;margin-bottom:8px}.read-toggle{flex:none;padding:4px 8px 12px}.chat-messages{overflow-y:auto;overscroll-behavior:contain;min-height:0;flex:1;padding-bottom:24px}.composer{flex:none;position:static;padding:12px 4px 8px}.chat-view .status{flex:none;margin:4px 0;min-height:20px}.bubble-actions{display:flex;gap:8px;margin-top:8px}.bubble-actions button{min-height:48px}.typing-dots{animation:blink .8s steps(2,end) infinite}.retry-box{align-self:flex-start}.result-sheet{max-height:80dvh;overflow:auto}.sheet #resultBody{font-size:24px;line-height:32px}.sheet #resultBody p{min-height:0}.error-note{padding:12px;background:var(--pink)}@media(prefers-reduced-motion:reduce){.typing-dots{animation:none}} </style><link rel="apple-touch-icon" sizes="1024x1024" href="./apple-touch-icon.png"><meta name="theme-color" content="#FAFFD6"></head><body><main class="shell">
<section class="view" id="home"><div class="top"><span id="dateLabel"></span><strong id="dayLabel">Day 1</strong></div><div class="hero"><h1>Daily<br>English</h1><svg class="sun" width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><g fill="#FF839D"><rect x="28" y="4" width="8" height="12"/><rect x="28" y="48" width="8" height="12"/><rect x="4" y="28" width="12" height="8"/><rect x="48" y="28" width="12" height="8"/><rect x="20" y="20" width="24" height="24"/><rect x="8" y="8" width="8" height="8"/><rect x="48" y="8" width="8" height="8"/></g><g fill="#000"><rect x="24" y="28" width="4" height="4"/><rect x="36" y="28" width="4" height="4"/></g></svg></div><div id="homeCards" class="stack"></div><div class="footer"><p>현재 난이도: <strong id="levelLabel">중급</strong></p><button class="pixel wide cream" id="levelOpen">난이도 변경 ▾</button></div></section>

</main><div class="overlay" id="overlay" hidden></div><div class="sheet" id="resultSheet" role="dialog" aria-modal="true" aria-label="대화 결과" hidden><h2 class="big">대화 완료!</h2><div id="resultBody"></div><button class="pixel wide mint" id="resultClose">기록으로 이동</button></div><div class="sheet" id="levelSheet" role="dialog" aria-modal="true" aria-label="난이도 선택" hidden><p id="sheetText"></p><div id="levelOptions"></div><button class="pixel wide cream" id="levelClose">닫기</button></div>
<script>
'use strict';

 "x": "I would like to request a refund."}, {"w": "delivery", "p": "명사", "k": "배송", "x": "The delivery arrived early."}, {"w": "neighborhood", "p": "명사", "k": "동네", "x": "I love this neighborhood."}, {"w": "crowded", "p": "형용사", "k": "붐비는", "x": "The train was crowded."}, {"w": "relaxed", "p": "형용사", "k": "편안한", "x": "I feel relaxed after a walk."}];
const TOPICS=[['가벼운 일상',['오늘 날씨','출퇴근길','오늘 먹은 음식','주말 계획','요즘 일상','직장에서 있었던 일','가벼운 안부']],['취향과 경험',['좋아하는 음식','여행 경험','영화와 드라마','음악 취향','운동과 건강 습관','기억에 남는 하루','취미 생활','최근 배운 것']],['의견 나누기',['재택근무의 장단점','일과 삶의 균형','AI와 일의 미래','도시 생활과 시골 생활','좋은 리더의 조건','소셜 미디어의 영향','새로운 기술을 배우는 이유']]];

const KEY='daily-english-app-v1';
const $=id=>document.getElementById(id), el=(tag,cls,txt)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=String(txt);return n}, add=(p,...xs)=>{xs.forEach(x=>p.append(x));return p}, clear=n=>n.replaceChildren(), btn=(txt,cls,fn)=>{const b=el('button',cls,txt);b.type='button';if(fn)b.addEventListener('click',fn);return b};
const today=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const defaults={start:today(),level:'중급',autoRead:true,useToday:true,seen:{},sessions:[],vocab:{},vstat:{},reports:[]};
let state;try{state={...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{state={...defaults}};
for(const key of ['seen','vocab','vstat'])if(!state[key]||typeof state[key]!=='object'||Array.isArray(state[key]))state[key]={};
for(const key of ['sessions','reports'])if(!Array.isArray(state[key]))state[key]=[];
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){console.warn('Local storage unavailable',e)}};
const dayNumber=()=>Math.max(1,Math.floor((new Date(today()+'T12:00:00')-new Date(state.start+'T12:00:00'))/86400000)+1), exprDay=()=>EXPRESSIONS[(dayNumber()-1)%28%EXPRESSIONS.length], exprKeys=()=>exprDay().items.map(x=>x.e), dayDate=n=>{const d=new Date(state.start+'T12:00:00');d.setDate(d.getDate()+n-1);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
function icon(type){const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 32 32');svg.setAttribute('width','40');svg.setAttribute('height','40');svg.setAttribute('aria-hidden','true');const shapes={book:[[4,6,10,20],[18,6,10,20],[15,8,2,20]],chat:[[4,5,24,18],[8,23,6,5],[10,11,4,4],[18,11,4,4]],chart:[[5,18,5,9],[13,12,5,15],[21,6,5,21]],card:[[5,4,22,24],[11,9,10,4],[9,17,14,3]]};(shapes[type]||shapes.card).forEach(([x,y,w,h],i)=>{const r=document.createElementNS(svg.namespaceURI,'rect');Object.entries({x,y,width:w,height:h,fill:i===0?'#000':i===1?'#FF839D':'#CBF4AE'}).forEach(([k,v])=>r.setAttribute(k,v));svg.append(r)});return svg}
let view='home', current=null, chatSerial=0, pending=new Set(), speech=null, micActive=false, study=null, wordPromise=null;
function show(id){view=id;document.querySelectorAll('.view').forEach(v=>v.hidden=v.id!==id);if(id==='home')renderHome();if(id==='expressions')renderExpressions();if(id==='topics')renderTopics();if(id==='words')renderWords();if(id==='records')renderRecords();if(id==='chat')fitChat();window.scrollTo(0,0)}
function fitChat(){if(view!=='chat')return;const h=window.visualViewport?window.visualViewport.height:window.innerHeight;const shell=document.querySelector('.shell');shell.style.height=Math.round(h)+'px';shell.style.minHeight='0'}

const LEVEL={초급:'Beginner-friendly: very simple everyday words, short sentences (under 12 words), speak slowly and clearly, avoid idioms.',중급:'Intermediate: natural everyday spoken English with common idioms and phrasal verbs, normal pace.',상급:'Advanced: rich natural vocabulary, idioms, nuance and longer sentences, like talking with a native friend.'};
const MODE={토론:'This is a discussion. Share a short, genuine-sounding opinion with one reason, then ask what the learner thinks. On politically contested topics, do NOT take a side: lay out both sides fairly in a sentence each and ask what the learner thinks.',스몰톡:'This is small talk. Be warm and curious, add a small personal detail of your own sometimes, and ask one natural follow-up question.'};
function conversationPrompt(session,opening){const targets=state.useToday?'Target expressions the learner studied today (use at most ONE per turn, only when it fits naturally, and never force it; vary which one):\n'+session.exprs.map(x=>'- '+x).join('\n'):'';const transcript=opening?'Start the conversation: greet the learner briefly and ask one opening question about the topic.':session.msgs.filter(m=>!m.pending).map(m=>(m.r==='ai'?'Alex: ':'Learner: ')+m.t).join('\n')+'\nWrite Alex\'s next message.';return `You are Alex, a friendly native English speaker having a casual voice-style chat with a Korean working adult who is practicing spoken English.\nLearner level: ${LEVEL[session.level]}\nTopic: ${session.topic} (${session.kind}).\n${MODE[session.kind]}\nStyle: natural spoken American English with contractions. One to three short sentences, about 35 words at most. Usually end with a question. No lists, no emojis, no markdown, no quotation marks around your message.\nNever correct the learner's grammar in your reply (corrections are shown elsewhere). If you truly cannot understand them, ask naturally for clarification. If they write in Korean, answer in English and gently invite them to try in English.\nStay in English only. Do not mention being an AI unless asked.\n${targets}\n${transcript}\nOutput only the message text.`}
function correctionPrompt(previous,sentence){return `You check ONE sentence from a Korean learner of English in a casual conversation.\nPartner's previous message: ${JSON.stringify(previous)}\nLearner's sentence: ${JSON.stringify(sentence)}\nFlag it only if it has a real mistake or would sound clearly unnatural to a native speaker (grammar, wrong word, wrong preposition, awkward phrasing).\nDo NOT flag: capitalization, missing or extra punctuation, contractions, casual fragments and slang that natives use, speech-to-text slips, or small style preferences. When unsure, treat it as correct.\nIf the sentence is mostly Korean, flag it and give a natural English version.\nIf it is fine, output exactly {"ok":true}\nOtherwise output {"ok":false,"better":"<natural corrected version keeping the learner's meaning>","why":"<one or two short Korean sentences naming the main mistake>"}\nOutput JSON only.`}
function usagePrompt(s){return `A Korean learner practiced English in a chat. Decide which target expressions the learner actually used in their own sentences.\nCount an expression only if the learner used that phrase or a very close variation of the same pattern. Talking about the same topic does not count.\nLearner sentences:\n${s.msgs.filter(m=>m.r==='me').map(m=>'- '+m.t).join('\n')}\nTarget expressions:\n${s.exprs.map((e,i)=>i+': '+e).join('\n')}\nOutput JSON only: {"used":[numbers]}`}
function vocabPrompt(n,exclude){const diff={초급:'CEFR A2 to B1',중급:'CEFR B1 to B2',상급:'CEFR B2 to C1'}[state.level];return `Make a list of 30 everyday English vocabulary words for a Korean working adult who wants to speak more natural daily English.\nDifficulty: ${diff}.\nChoose common, high-frequency words that people really use in daily conversation. No rare, academic, technical or slang-only words.\nMix of word types: about 12 verbs (include a few phrasal verbs), 10 nouns, 6 adjectives and 2 adverbs.\nOptional soft hint for today's theme (not required): ${exprDay().theme}.\nEach item has: w = the word or phrasal verb (lowercase), p = part of speech in Korean (명사, 동사, 형용사, 부사 or 구동사), k = the most common everyday meaning in Korean (short), x = one natural, grammatically correct example sentence of 6 to 12 words that uses the word.\nNo duplicates.\nDo NOT use any of these words (already learned): ${exclude.slice(-500).join(', ')}\nOutput JSON only, exactly 30 items: {"words":[{"w":"","p":"","k":"","x":""}]}`}
// Single AI gateway. Replace only this function when connecting a real provider.
async function callAI(prompt,{tier}={tier:'default'}){if(!['quick','default'].includes(tier))throw Error('Invalid tier');await new Promise(resolve=>setTimeout(resolve,500));if(prompt.includes('You check ONE sentence')){const line=prompt.match(/Learner's sentence: (.+)/),raw=line?JSON.parse(line[1]):'';if(/\bi am agree\b/i.test(raw))return JSON.stringify({ok:false,better:raw.replace(/\bi am agree\b/ig,'I agree'),why:'agree는 동사이므로 am을 쓰지 않아요.'});if(/[가-힣]{3,}/.test(raw))return JSON.stringify({ok:false,better:'I want to talk about that in English.',why:'한국어 문장을 자연스러운 영어로 바꿨어요.'});return '{"ok":true}'}
if(prompt.includes('Decide which target expressions')){const lines=prompt.split('Target expressions:');const sentences=lines[0].split('Learner sentences:')[1]||'';const exprs=[...lines[1].matchAll(/^\d+: (.+)$/gm)].map(m=>m[1]);return JSON.stringify({used:exprs.flatMap((x,i)=>sentences.toLowerCase().includes(x.toLowerCase().replace(/[.!?]+$/,''))?[i]:[])})}
if(prompt.includes('Make a list of 30 everyday English'))return JSON.stringify({words:WORDS});
if(prompt.includes('You are Alex')){const opening=prompt.includes('Start the conversation:');const topic=(prompt.match(/^Topic: (.+?) \(/m)||[])[1]||'your day';const lines=["That sounds interesting! What happened next?","I can see why you'd feel that way. What do you think?","Oh, really? I'd love to hear more about it.","That makes sense. How do you usually handle that?"];const turns=(prompt.match(/^Learner:/gm)||[]).length;return opening?`Hey! How's your day going? Let's talk about ${topic}.`:lines[(turns-1+lines.length)%lines.length]}
throw Error('Unknown AI request')}
function parseJSON(raw){const a=raw.indexOf('{'),b=raw.lastIndexOf('}');if(a<0||b<a)throw Error('Invalid JSON');return JSON.parse(raw.slice(a,b+1))}
function parseWords(raw){const matches=raw.match(/\{\s*"w"\s*:\s*"(?:\\.|[^"\\])*"\s*,\s*"p"\s*:\s*"(?:\\.|[^"\\])*"\s*,\s*"k"\s*:\s*"(?:\\.|[^"\\])*"\s*,\s*"x"\s*:\s*"(?:\\.|[^"\\])*"\s*\}/g)||[];const seen=new Set();return matches.flatMap(t=>{try{const w=JSON.parse(t);if(!['w','p','k','x'].every(k=>typeof w[k]==='string'&&w[k].trim()))return [];const key=w.w.trim().toLowerCase();if(seen.has(key))return [];seen.add(key);w.w=key;return [w]}catch{return []}})}
function retryBox(root,text,retry){const box=el('div','pixel panel error-note');add(box,el('p','',text),btn('다시 시도','pixel small-btn white',retry));root.append(box)}
function startChat(topic,kind){chatSerial++;const token=chatSerial;current={id:String(Date.now()),topic,kind,level:state.level,startedAt:Date.now(),msgs:[],exprs:state.useToday?exprKeys():[],used:[],rev:1};$('chatTitle').textContent=topic;$('chatInput').value='';$('micStatus').textContent='';updateRead();show('chat');requestOpening(token)}
async function requestOpening(token){if(!current||token!==chatSerial)return;const s=current;s.openingPending=true;renderChat();try{const reply=(await callAI(conversationPrompt(s,true),{tier:'default'})).trim();if(!reply)throw Error('Empty reply');if(token!==chatSerial)return;s.msgs.push({r:'ai',t:reply,ts:Date.now(),fb:null});s.openingPending=false;renderChat();speak(reply)}catch{if(token!==chatSerial)return;s.openingPending=false;s.openingFailed=true;renderChat()}}
function renderChat(){if(!current)return;renderMessages($('chatMessages'),current.msgs,false);const root=$('chatMessages');if(current.openingPending||current.replyPending)root.append(el('div','pixel message ai typing-dots','입력 중 ···'));if(current.openingFailed)retryBox(root,'첫 인사를 불러오지 못했어요.',()=>{current.openingFailed=false;requestOpening(chatSerial)});if(current.replyFailed)retryBox(root,'답변을 불러오지 못했어요.',()=>{current.replyFailed=false;requestReply(chatSerial)});root.scrollTop=root.scrollHeight}
function renderMessages(root,msgs,readonly){clear(root);msgs.forEach(m=>{if(m.r==='ai'){const wrap=el('div','message-wrap');wrap.style.alignItems='flex-start';const bubble=el('div','pixel message ai',m.t);wrap.append(bubble);wrap.append(btn('▶ 다시 듣기','small-btn',()=>speak(m.t,true)));root.append(wrap)}else{const wrap=el('div','message-wrap');wrap.append(el('div','pixel message user',m.t));if(m.fb&&m.fb.better){const c=el('div','pixel correction');add(c,el('strong','','이렇게 말해 보세요'),el('p','big',m.fb.better),el('p','',m.fb.why));const actions=el('div','actions');actions.append(btn('▶ 고친 문장 듣기','pixel small-btn white',()=>speak(m.fb.better,true)));if(!readonly)actions.append(btn('어색해요 표시','pixel small-btn pink',()=>report('교정',m.t)));c.append(actions);wrap.append(c)}root.append(wrap)}})}
$('chatForm').addEventListener('submit',e=>{e.preventDefault();sendMessage()});
function sendMessage(){if(!current)return;const input=$('chatInput'),text=input.value.trim();if(!text)return;primeSpeech();const s=current,token=chatSerial;const previous=[...s.msgs].reverse().find(m=>m.r==='ai')?.t||'';const message={r:'me',t:text,ts:Date.now(),fb:null};s.msgs.push(message);input.value='';renderChat();const correction=callAI(correctionPrompt(previous,text),{tier:'quick'}).then(raw=>{const result=parseJSON(raw);if(token!==chatSerial)return;if(result.ok===false&&typeof result.better==='string'&&result.better.trim()&&result.better.trim()!==text&&typeof result.why==='string'){message.fb={better:result.better,why:result.why};renderChat()}}).catch(()=>{});pending.add(correction);correction.finally(()=>pending.delete(correction));requestReply(token)}
async function requestReply(token){if(!current||token!==chatSerial)return;const s=current;s.replyPending=true;s.replyFailed=false;renderChat();try{const reply=(await callAI(conversationPrompt(s,false),{tier:'default'})).trim();if(!reply)throw Error('Empty reply');if(token!==chatSerial)return;s.msgs.push({r:'ai',t:reply,ts:Date.now(),fb:null});s.replyPending=false;renderChat();speak(reply)}catch{if(token!==chatSerial)return;s.replyPending=false;s.replyFailed=true;renderChat()}}

async function finishChat(){if(!current)return;const s=current;if(!s.msgs.some(m=>m.r==='me')){leaveChat();return}const token=chatSerial;const b=$('finishChat');b.disabled=true;b.textContent='정리 중';let used;try{const result=parseJSON(await callAI(usagePrompt(s),{tier:'quick'}));if(!Array.isArray(result.used))throw Error('Invalid used');used=[...new Set(result.used.filter(i=>Number.isInteger(i)&&i>=0&&i<s.exprs.length))]}catch{used=fallbackUsed(s)}finally{b.disabled=false;b.textContent='마치기'}if(token!==chatSerial)return;s.used=used;s.duration=durationSeconds(s.msgs);s.endedAt=Date.now();state.sessions.unshift(s);save();chatSerial++;current=null;stopMic();window.speechSynthesis?.cancel();const root=$('resultBody');clear(root);[['대화 시간',`${Math.floor(s.duration/60)}분 ${s.duration%60}초`],['내가 말한 문장',`${s.msgs.filter(m=>m.r==='me').length}개`],['고친 문장',`${s.msgs.filter(m=>m.r==='me'&&m.fb).length}개`],['오늘의 표현 사용',`${used.length}/${s.exprs.length}개`]].forEach(([k,v])=>root.append(el('p','',`${k}: ${v}`)));$('overlay').hidden=false;$('resultSheet').hidden=false}

async function getWords(){const n=dayNumber();if(state.vocab[n]?.words?.length>=20)return state.vocab[n].words;if(wordPromise)return wordPromise;wordPromise=(async()=>{const excluded=Object.values(state.vocab).flatMap(v=>v.words||[]).map(w=>w.w);let collected=[];for(let attempt=0;attempt<2;attempt++){const raw=await callAI(vocabPrompt(n,excluded.concat(collected.map(w=>w.w))),{tier:'default'});const next=parseWords(raw);const known=new Set([...excluded,...collected.map(w=>w.w)].map(x=>x.toLowerCase()));collected.push(...next.filter(w=>!known.has(w.w)));collected=[...new Map(collected.map(w=>[w.w,w])).values()];if(collected.length>=25)break}if(collected.length<20)throw Error('단어를 충분히 생성하지 못했습니다.');const words=collected.slice(0,30);state.vocab[n]={n,words};save();return words})();try{return await wordPromise}finally{wordPromise=null}}

function shuffle(a){const out=[...a];for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]]}return out}
function quizOptions(w){const pool=Object.values(state.vocab).flatMap(v=>v.words||[]).concat(WORDS);const other=shuffle([...new Set(pool.filter(x=>x.k!==w.k).map(x=>x.k))]).slice(0,3);return shuffle([w.k,...other])}
function updateScore(w,ok,mode){state.vstat[w]=ok?(mode==='card'?Math.max(1,state.vstat[w]||0):Math.min(3,(state.vstat[w]||0)+1)):0;save()}
function renderStudy(){const root=$('studyBody');clear(root);$('studyTitle').textContent=study.mode==='card'?'카드로 외우기':'퀴즈 풀기';if(study.i>=study.list.length){const wrong=study.answers.filter(x=>!x.ok).map(x=>x.word);add(root,el('h3','big','학습 완료!'),el('p','big',`정답 / 외웠어요: ${study.answers.length-wrong.length}/${study.answers.length}`),el('p','',`틀린 단어: ${wrong.join(', ')||'없음'}`));if(wrong.length)root.append(btn('틀린 것만 다시','pixel wide pink',()=>begin(study.mode,study.list.filter(w=>wrong.includes(w.w)))));root.append(btn('단어 목록으로','pixel wide mint',()=>show('words')));return}const w=study.list[study.i];root.append(el('p','progress',`${study.i+1} / ${study.list.length}`));const panel=el('div','pixel panel');add(panel,el('h3','',w.w),el('p','',w.p));if(study.mode==='card'){if(study.revealed){add(panel,el('p','big',w.k),el('p','big',w.x));const a=el('div','actions');add(a,btn('외웠어요','pixel mint',()=>answerCard(true)),btn('다시 볼래요','pixel pink',()=>answerCard(false)));panel.append(a)}else panel.append(btn('뜻 보기','pixel wide mint',()=>{study.revealed=true;renderStudy()}))}else{if(!study.options)study.options=quizOptions(w);study.options.forEach(k=>{const chosen=study.selected!==null;const b=btn(k,`pixel choice ${chosen?(k===w.k?'correct':k===study.selected?'wrong':'white'):'white'}`,()=>{if(study.selected!==null)return;study.selected=k;const ok=k===w.k;study.answers.push({word:w.w,ok});updateScore(w.w,ok,'quiz');renderStudy()});b.disabled=chosen;panel.append(b)});if(study.selected!==null)add(panel,el('p','big',w.x),btn('다음','pixel wide mint',()=>{study.i++;study.selected=null;study.options=null;renderStudy()}))}root.append(panel)}
function answerCard(ok){const w=study.list[study.i];study.answers.push({word:w.w,ok});updateScore(w.w,ok,'card');study.i++;study.revealed=false;renderStudy()}
function renderRecords(){const end=new Date(today()+'T12:00:00'),recent=state.sessions.filter(s=>s.msgs?.some(m=>m.r==='me')&&((end-new Date(new Date(s.startedAt).toLocaleDateString('en-CA')+'T12:00:00'))/86400000)>=0&&((end-new Date(new Date(s.startedAt).toLocaleDateString('en-CA')+'T12:00:00'))/86400000)<7);const dates=new Set(recent.map(s=>new Date(s.startedAt).toLocaleDateString('en-CA')));const seconds=recent.reduce((a,s)=>a+(s.duration||0),0);const numerator=recent.reduce((a,s)=>a+(s.used||[]).length,0),denominator=recent.reduce((a,s)=>a+(s.exprs||[]).length,0);const stats=$('stats');clear(stats);[['대화한 날',`${dates.size}/7`],['하루 평균',`${dates.size?Math.round(seconds/60/dates.size):0}분`],['표현 활용률',`${denominator?Math.round(numerator/denominator*100):0}%`]].forEach(([k,v])=>add(stats,add(el('div','pixel stat'),el('strong','',v),el('span','',k))));const cal=$('calendar');clear(cal);const first=Math.floor((dayNumber()-1)%28/14)*14+1;for(let i=first;i<first+14;i++){const ds=dayDate(i),sessions=state.sessions.filter(s=>new Date(s.startedAt).toLocaleDateString('en-CA')===ds&&s.msgs?.some(m=>m.r==='me'));const duration=sessions.reduce((a,s)=>a+(s.duration||0),0);const c=el('div',`day ${duration>=600?'long':sessions.length?'talked':''} ${i===((dayNumber()-1)%28+1)?'today':''}`,`D${i}`);c.title=ds;cal.append(c)}const hist=$('historyList');clear(hist);if(!state.sessions.length)hist.append(el('p','','아직 저장된 대화가 없습니다.'));state.sessions.forEach(s=>hist.append(btn(`${new Date(s.startedAt).toLocaleDateString('ko-KR')} · ${s.topic} · ${Math.round((s.duration||0)/60)}분`,'pixel history-btn white',()=>{$('replayTitle').textContent=s.topic;renderMessages($('replayMessages'),s.msgs||[],true);show('replay')})));const awkward=$('awkwardList');clear(awkward);if(!state.reports.length)awkward.append(el('p','','표시한 표현이 없습니다.'));state.reports.forEach(x=>awkward.append(el('p','pixel panel',`${x.kind}: ${x.text}`)))}
$('levelOpen').onclick=()=>{const root=$('levelOptions');clear(root);['초급','중급','상급'].forEach(level=>root.append(btn(`${level}${state.level===level?' ✓':''}`,'pixel wide '+(state.level===level?'mint':'white'),()=>{state.level=level;save();closeSheet();renderHome()})));$('overlay').hidden=false;$('levelSheet').hidden=false;const message='난이도를 선택해 주세요!';const output=$('sheetText');output.textContent='';if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){output.textContent=message;return}let i=0;clearInterval(window.sheetTimer);window.sheetTimer=setInterval(()=>{output.textContent+=message[i++]||'';if(i>=message.length)clearInterval(window.sheetTimer)},55)};
function closeSheet(){clearInterval(window.sheetTimer);$('overlay').hidden=true;$('levelSheet').hidden=true};$('levelClose').onclick=closeSheet;$('overlay').onclick=()=>{if(!$('resultSheet').hidden)closeResult();else closeSheet()};document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('resultSheet').hidden)closeResult();else closeSheet()}});renderHome();
</script></body></html>
